<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- STYLES CSS -->
        <link rel="stylesheet" href="css/view_image.css">

        <!-- BOX ICONS CSS-->
        <link href='https://cdn.jsdelivr.net/npm/boxicons@2.0.5/css/boxicons.min.css' rel='stylesheet'>
        <title>View Image</title>
    </head>
    <body id="body">
        <div class="l-navbar" id="navbar">
            <nav class="nav">
                <div>
                    <a href="#" class="nav__logo">
                        <img src="img/logo.svg" alt="" class="nav__logo-icon">
                        <span class="nav__logo-text">Bedimcode</span>
                    </a>
    
                    <div class="nav__toggle" id="nav-toggle">
                        <i class='bx bx-chevron-right'></i>
                    </div>
    
                    <ul class="nav__list">
                        <a href="#" class="nav__link active">
                            <i class='bx bx-grid-alt nav__icon'></i>
                            <span class="nav__text">Home</span>
                        </a>
                        <a href="#" class="nav__link">
                            <i class='bx bx-user nav__icon' ></i>
                            <span class="nav__text">User</span>
                        </a>
                        <a href="#" class="nav__link">
                            <i class='bx bx-bell nav__icon' ></i>
                            <span class="nav__text">Notification</span>
                        </a>
                        <a href="#" class="nav__link">
                            <i class='bx bx-heart nav__icon'></i>
                            <span class="nav__text">Favorites</span>
                        </a>
                        <a href="#" class="nav__link">
                            <i class='bx bx-bookmark nav__icon'></i>
                            <span class="nav__text">Saved</span>
                        </a>
                        <a href="#" class="nav__link">
                            <i class='bx bx-message-rounded nav__icon' ></i>
                            <span class="nav__text">Chat</span>
                        </a>                 
                    </ul>
                </div>
                <a href="#" class="nav__link">           
                    <i class='bx bx-log-out-circle nav__icon'></i>
                    <span class="nav__text">Close</span>
                </a>
            </nav>
        </div>
        
        <main>
            <header>
                <h1>Dashboard</h1>
            </header>

            <div class="main">
                <div class="main-content container">
                    <!-- TITLE -->
                    <div class="title">
                        <box-icon class="title__icon" type='solid' name='magic-wand'></box-icon>
                        <p class="title__text">Image Viewer</p>
                    </div>

                    <div class="no-images">
                        <p class="no-images__text">No images to label</p>
                        <div class="grid">
                            <!-- EDIT PROMPT BUTTON -->
                            <button class="form-container__button form-container__button--secondary" onclick="editPrompt()">
                                <box-icon type='solid' name='edit'></box-icon>
                                Upload Images
                            </button>

                            <!-- GENERATE IMAGE BUTTON -->
                            <button class="form-container__button" onclick="generateImage()">
                                <box-icon type='solid' name='magic-wand'></box-icon>
                                Dashboard
                            </button>

                        </div>
                    </div>
 
                    <div class="form-and-image">

                        <!-- IMAGE CONTAINER -->
                        <section class="image-container" id="imageContainer">
                            <!-- IMAGE RESULT -->
                            <img class="image-container__image-result" id="imageResult" src="img/example.jpeg">
                        </section>

                        <!-- FORM CONTAINER -->
                        <section class="form-container">
                            <!-- PROMPT INPUT -->
                            <textarea class="form-container__prompt-input" id="prompt" rows="5"
                                placeholder="Describe your image..."></textarea>
                            <div class="form-container__dropdown-group">
                                <!-- DROPDOWN STYLE -->
                                <select class="form-container__dropdown" id="dropdownStyles">
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                                <!-- DROPDOWN RATIO -->
                                <select class="form-container__dropdown" id="dropdownRatio">
                                    <option value="1:1">1:1</option>
                                    <option value="16:9">16:9</option>
                                    <option value="9:16">9:16</option>
                                </select> 
                            </div>
                        </section>

                    </div>

                    <div class="form_actions grid">
                        <!-- EDIT PROMPT BUTTON -->
                        <button class="form-container__button form-container__button--secondary" onclick="editPrompt()">
                            <box-icon type='solid' name='edit'></box-icon>
                            Edit Prompt
                        </button>

                        <!-- GENERATE IMAGE BUTTON -->
                        <button class="form-container__button" onclick="generateImage()">
                            <box-icon type='solid' name='magic-wand'></box-icon>
                            Generate Image
                        </button>

                    </div>

                </div>

                </div>
            </div>
        </main>
    </body>
    <!-- MAIN JS -->
    <script src="js/view_image.js"></script>
</html>
